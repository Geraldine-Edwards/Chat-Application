<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Application 2026</title>
     <script defer type= 'module' src="display-chat.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="chat-container">
    <div class="chat-header">💬 Chatterbox</div>
      <div id="chat-display">
        <div id="chat-messages"></div>
      </div>
     </div>

    <div id="add-message-container">
       <!-- add a new message to the chat -->
      <form id="add-message-form">
        <input type="text" id="sender-name" name="sender-name" placeholder="Your name" required>
        <input type="text" id="new-message" name="new-message" placeholder="Type a message..." required>
        <div class="form-actions">
          <input type="color" id="color-picker" name="color" value="#000000">
          <button type="submit" id="submit-message">Send</button>
        </div>    
        <div id="add-chat-message" aria-live="polite"></div>
      </form>
    </div>
  </body>
</html>
